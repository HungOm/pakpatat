name: Build macOS app

# Unlike the Windows build, this one CAN be run locally on a Mac:
#
#     pip install pyinstaller
#     python build_index.py                 # once, so the model gets bundled
#     pyinstaller packaging/pakpatat-macos.spec --noconfirm
#     ./dist/Pakpatat.app/Contents/MacOS/Pakpatat --selftest
#
# This exists to produce the release asset reproducibly and to keep the two
# platforms building from the same tag.

on:
  push:
    tags: ["v*"]
    # The same branch build-windows.yml watches, so one push proves both
    # platforms. Without this the macOS job only ever ran on a tag, which
    # meant a change to it could not be tested without cutting a release.
    branches: ["ci/build"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-14 is Apple Silicon. PyInstaller builds for the architecture of the
    # Python running it and onnxruntime has no universal2 wheel, so this runner
    # choice IS the architecture of the published .dmg.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Read the version, check it matches the tag
        run: |
          VERSION=$(python packaging/version_info.py --print)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            [ "$TAG" = "$VERSION" ] || {
              echo "::error::tag v$TAG != __version__ $VERSION"; exit 1; }
          fi

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: data/.models
          key: fastembed-macos-${{ hashFiles('requirements.txt') }}

      - name: Fetch the embedding model if not cached
        # Bundling it is what lets a fresh install search with no internet.
        run: |
          python -c "import os; os.environ.setdefault('FASTEMBED_CACHE_PATH','data/.models'); from fastembed import TextEmbedding; TextEmbedding('sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2'); print('model ready')"

      - name: Build the .app
        run: pyinstaller packaging/pakpatat-macos.spec --noconfirm

      - name: Smoke-test the frozen app
        # Not continue-on-error: an app that cannot find its own UI must not ship.
        #
        # Unlike the Windows job, this one has always genuinely run: bash waits
        # for a process whatever its subsystem, so there was never the
        # PowerShell problem of a GUI-subsystem exe returning instantly and the
        # step passing regardless.
        run: ./dist/Pakpatat.app/Contents/MacOS/Pakpatat --selftest

      - name: Build the .dmg
        run: |
          ARCH=$(lipo -archs dist/Pakpatat.app/Contents/MacOS/Pakpatat | tr -d ' ')
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          rm -rf build/dmg && mkdir -p build/dmg
          cp -R dist/Pakpatat.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Pakpatat ${VERSION}" -srcfolder build/dmg \
            -ov -format UDZO "dist/Pakpatat-${VERSION}-macOS-${ARCH}.dmg"

      - name: Verify the .dmg, not the folder it came from
        # The .app has been proven; the .dmg is what people download, and it
        # is a separate artifact that its own build step can break. So mount
        # it and run the copy INSIDE it -- selftest for "can it find its own
        # parts", then ask it for its own page, which selftest structurally
        # cannot check: it verifies index.html exists, not that the server
        # hands it over.
        #
        # A locally built .dmg carries no quarantine attribute, so Gatekeeper
        # does not stand in the way here the way it does for a download.
        run: |
          set -euo pipefail
          DMG="dist/Pakpatat-${VERSION}-macOS-${ARCH}.dmg"
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -quiet
          # Always detach, including when a check below fails.
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT

          APP="$MNT/Pakpatat.app/Contents/MacOS/Pakpatat"
          test -x "$APP" || { echo "::error::no runnable app inside the .dmg"; exit 1; }
          "$APP" --selftest

          "$APP" --serve --port 8765 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true; hdiutil detach "$MNT" -quiet || true' EXIT
          for i in $(seq 1 30); do
            BODY=$(curl -fsS http://127.0.0.1:8765/ 2>/dev/null) && break || sleep 2
          done
          case "${BODY:-}" in
            *'id="q"'*) echo "served its own UI: ${#BODY} bytes, question box present" ;;
            *) echo "::error::the app in the .dmg never served its UI"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: Pakpatat-${{ env.VERSION }}-macOS-${{ env.ARCH }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body: |
            **macOS, Apple Silicon.** Open the .dmg and drag to Applications.

            Not code-signed: on first launch, right-click the app → Open → Open.

            Contains the application only — **no archive content** (see the README's notices).
            Offline answers also need [Ollama](https://ollama.com/download) and
            `ollama pull qwen2.5:3b-instruct`.

            Needs macOS 11+, 8 GB RAM and 3 GB free disk for offline use.
