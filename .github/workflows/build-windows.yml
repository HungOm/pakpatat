name: Build Windows installer

# WHY THIS EXISTS
# ---------------
# PyInstaller does not cross-compile. A Windows .exe can only be produced on
# Windows, so a project maintained on a Mac cannot build its own installer
# locally. This runs the build on a GitHub-hosted Windows runner instead.
#
# Push a tag to cut a release:
#     git tag v1.0.0 && git push origin v1.0.0
# ...or run it by hand from the Actions tab to get a downloadable artifact
# without publishing anything.

on:
  push:
    tags: ["v*"]
    # workflow_dispatch is a REST call, and an SSH key only authenticates git,
    # so a Mac with no token cannot dispatch this. A push IS git, so this
    # branch is the one trigger reachable with nothing but the deploy key.
    # build-macos.yml watches the same branch, so one push exercises both.
    branches: ["ci/build"]
  workflow_dispatch:

permissions:
  contents: write          # needed only by the release step below

jobs:
  # WHY A SECOND JOB
  # ----------------
  # The installer step has failed in every run this workflow has ever had, and
  # it sits at the END of a ~30-minute build: install deps, fetch a 220MB
  # model, freeze ~500MB, and only then find out whether ISCC likes the script.
  # That is a terrible loop to debug in.
  #
  # This job compiles the SAME installer.iss against a stub payload in about
  # two minutes. It cannot tell us anything about size or compression -- but if
  # the fault is in the script, it says so immediately, and if it passes while
  # `build` still fails, that itself narrows the fault to the real payload.
  iss-lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stand up a stub payload
        # installer.iss globs ..\dist\Pakpatat\* and refuses an empty match,
        # so give it something to find. Contents are irrelevant to ISCC.
        run: |
          New-Item -ItemType Directory -Force -Path dist\Pakpatat\ui | Out-Null
          Set-Content dist\Pakpatat\Pakpatat.exe  "stub"
          Set-Content dist\Pakpatat\ui\index.html "<html></html>"

      - name: Locate ISCC
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
          "Inno Setup {0}" -f (Get-Item $iscc).VersionInfo.ProductVersion

      - name: Compile installer.iss against the stub
        id: lint
        continue-on-error: true
        # cmd, NOT PowerShell. Actions runs pwsh with $ErrorActionPreference
        # set to 'stop', so `iscc 2>&1 | Tee-Object` turns ISCC's first stderr
        # line into a terminating error and kills the pipeline -- truncating
        # the log immediately BEFORE the message we are trying to read. cmd
        # redirects at the process level and cannot do that.
        shell: cmd
        run: '"%ISCC%" packaging\installer.iss /DMyAppVersion=0.0.0 > iscc-lint.log 2>&1'

      - name: Report the error as annotations
        if: steps.lint.outcome == 'failure'
        # ::error:: annotations, not just the log, because check-run annotations
        # are readable from the PUBLIC API with no token -- which is the whole
        # point: it lets the error reach a Mac that cannot authenticate.
        run: |
          $log = "iscc-lint.log"
          if (Test-Path $log) {
            $lines = Get-Content $log | Where-Object { $_.Trim() }
            $hits  = $lines | Select-String -Pattern 'error|cannot|invalid|failed|not supported|unsupported' -SimpleMatch:$false
            $body  = (($lines | Select-Object -Last 40) -join "`n")
            $esc   = $body -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=ISCC stub tail::$esc"
            if ($hits) {
              $h = (($hits | ForEach-Object { $_.Line }) -join "`n")
              $he = $h -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Output "::error title=ISCC stub error lines::$he"
            }
          } else {
            Write-Output "::error title=ISCC stub::ISCC produced no log at all"
          }

      - name: Fail the job if the script does not compile
        if: steps.lint.outcome == 'failure'
        run: exit 1

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check the version matches the tag
        shell: bash
        run: |
          VERSION=$(python packaging/version_info.py --print)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            # A tag that disagrees with pakpatat/__init__.py would ship an
            # installer whose filename and Add/Remove Programs entry disagree.
            [ "$TAG" = "$VERSION" ] || {
              echo "::error::tag v$TAG != __version__ $VERSION"; exit 1; }
          fi

      - name: Cache the embedding model
        # Bundling it is what lets a fresh install search with no internet.
        # Cached between runs so it is fetched once, not every build.
        uses: actions/cache@v4
        with:
          path: data/.models
          key: fastembed-${{ hashFiles('requirements.txt') }}

      - name: Fetch the embedding model if not cached
        run: |
          python -c "import os; os.environ.setdefault('FASTEMBED_CACHE_PATH','data/.models'); from fastembed import TextEmbedding; TextEmbedding('sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2'); print('model ready')"

      - name: Generate the Windows version resource
        run: python packaging/version_info.py

      - name: Build with PyInstaller
        run: pyinstaller packaging/pakpatat.spec --noconfirm

      - name: Smoke-test the frozen build
        # Catches the failure this build is most prone to: a missing hidden
        # import or data file that shows up only outside a checkout. NOT
        # continue-on-error -- shipping an installer whose app cannot find its
        # own UI is worse than shipping nothing.
        #
        # Start-Process -Wait, NOT `& dist\Pakpatat\Pakpatat.exe`. The app is
        # frozen console=False, and PowerShell does not wait for a GUI-subsystem
        # process: it returns instantly and the step passes no matter what the
        # app did or what it exited with. This step reported 1.0s in every run
        # while the app's own imports take longer than that -- it had been
        # checking nothing since the day it was added.
        #
        # console=False also means the report has nowhere to print, so
        # PAKPATAT_SELFTEST_LOG asks the app to write it down for us.
        env:
          PAKPATAT_SELFTEST_LOG: ${{ github.workspace }}\selftest-build.log
        run: |
          $p = Start-Process -FilePath dist\Pakpatat\Pakpatat.exe `
                             -ArgumentList '--selftest' -Wait -PassThru
          if (Test-Path $env:PAKPATAT_SELFTEST_LOG) { Get-Content $env:PAKPATAT_SELFTEST_LOG }
          if ($p.ExitCode -ne 0) { throw "selftest exited $($p.ExitCode)" }

      - name: Ensure Inno Setup is available
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV
          "Inno Setup {0}" -f (Get-Item $iscc).VersionInfo.ProductVersion

      # A portable .zip of the folder PyInstaller just built and smoke-tested.
      # Produced BEFORE the installer is attempted, and shipped regardless of
      # whether the installer step succeeds, because these are two different
      # promises: this one only needs the app to compile and pass --selftest,
      # which the two steps above have already proven. v1.2.0 shipped with no
      # Windows download at all because ISCC failed after a perfectly good
      # build -- that must not be able to happen again.
      #
      # It is also the better download for some of this app's users: no
      # installer, no Add/Remove Programs entry, runs from a USB stick on a
      # managed laptop.
      - name: Package the portable .zip
        run: |
          $zip = "dist\Pakpatat-${{ env.VERSION }}-windows-x64-portable.zip"
          # 7-Zip is preinstalled on the runner and is minutes faster than
          # Compress-Archive here: PyInstaller emits several thousand small
          # files and Compress-Archive walks them one at a time. Fall back to
          # it anyway rather than depend on an image detail.
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=7 $zip .\dist\Pakpatat\* | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z exited $LASTEXITCODE" }
          } else {
            Compress-Archive -Path dist\Pakpatat\* -DestinationPath $zip -CompressionLevel Optimal
          }
          if (-not (Test-Path $zip)) { throw "no zip produced" }
          "portable zip: {0:N0} MB" -f ((Get-Item $zip).Length / 1MB)

      - name: Verify the .zip, not the folder it came from
        # The folder has been proven; the ZIP is what people actually download,
        # and it is a separate artifact that a packaging mistake can break on
        # its own. Unpack it somewhere else entirely and run the same check
        # there, so a file the zip step failed to include surfaces here rather
        # than on a case worker's laptop.
        env:
          PAKPATAT_SELFTEST_LOG: ${{ github.workspace }}\selftest-zip.log
        run: |
          $dest = "$env:RUNNER_TEMP\portable"
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          7z x "dist\Pakpatat-${{ env.VERSION }}-windows-x64-portable.zip" "-o$dest" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z could not unpack the zip" }
          $exe = Join-Path $dest "Pakpatat.exe"
          if (-not (Test-Path $exe)) { throw "the zip contains no Pakpatat.exe" }
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          if (Test-Path $env:PAKPATAT_SELFTEST_LOG) { Get-Content $env:PAKPATAT_SELFTEST_LOG }
          if ($p.ExitCode -ne 0) { throw "the unpacked portable build failed selftest ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: Pakpatat-${{ env.VERSION }}-windows-portable
          path: dist/*portable.zip
          if-no-files-found: error

      # continue-on-error, deliberately. ISCC is the one step here that can
      # fail on something other than this project's own code, and when it does
      # the .zip above is still a working Windows download. The summary below
      # makes the reason readable from the run page without digging through
      # the log, which is what made the last failure take so long to place.
      - name: Build the installer
        id: installer
        continue-on-error: true
        # cmd, for the reason spelled out on the lint job's compile step.
        shell: cmd
        run: '"%ISCC%" packaging\installer.iss /DMyAppVersion=${{ env.VERSION }} > iscc.log 2>&1'

      - name: Report why the installer failed
        if: steps.installer.outcome == 'failure'
        run: |
          $log = "iscc.log"
          if (Test-Path $log) {
            $lines = Get-Content $log | Where-Object { $_.Trim() }
            $hits  = $lines | Select-String -Pattern 'error|cannot|invalid|failed|not supported|unsupported' -SimpleMatch:$false
            $body  = (($lines | Select-Object -Last 40) -join "`n")
            $esc   = $body -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=ISCC tail::$esc"
            if ($hits) {
              $h = (($hits | ForEach-Object { $_.Line }) -join "`n")
              $he = $h -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Output "::error title=ISCC error lines::$he"
            }
          } else {
            Write-Output "::error title=ISCC::ISCC produced no log at all"
          }
          "## Installer step failed" >> $env:GITHUB_STEP_SUMMARY
          "The portable .zip was still built and published." >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path iscc.log) { Get-Content iscc.log -Tail 40 >> $env:GITHUB_STEP_SUMMARY }
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Install it, run it, make it serve, uninstall it
        # The installer compiling is not the same promise as the installer
        # working. This runs the real thing end to end on a clean machine:
        # silent install (PrivilegesRequired=lowest, so no admin needed, and
        # skipifsilent keeps the [Run] entry from launching the app behind us),
        # selftest the INSTALLED copy, then ask it for its own UI over HTTP --
        # the one failure selftest cannot see, since it checks that index.html
        # exists, not that the server hands it over. Then uninstall, which also
        # proves unins000.exe was produced and runs.
        if: steps.installer.outcome == 'success'
        env:
          PAKPATAT_SELFTEST_LOG: ${{ github.workspace }}\selftest-installed.log
        run: |
          $setup = (Get-Item dist\Pakpatat-Setup-*.exe).FullName
          $dir   = "$env:RUNNER_TEMP\installed"
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList `
                 "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir"
          if ($p.ExitCode -ne 0) { throw "the installer exited $($p.ExitCode)" }

          $exe = Join-Path $dir "Pakpatat.exe"
          if (-not (Test-Path $exe)) { throw "the installer left no Pakpatat.exe in $dir" }
          "installed {0:N0} files" -f (Get-ChildItem $dir -Recurse -File).Count

          $s = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          if (Test-Path $env:PAKPATAT_SELFTEST_LOG) { Get-Content $env:PAKPATAT_SELFTEST_LOG }
          if ($s.ExitCode -ne 0) { throw "the installed app failed selftest ($($s.ExitCode))" }

          $srv = Start-Process -FilePath $exe -ArgumentList '--serve','--port','8765' -PassThru
          try {
            $served = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri http://127.0.0.1:8765/ -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200 -and $r.Content -match 'id="q"') {
                  "served its own UI: HTTP 200, {0:N0} bytes, question box present" -f $r.Content.Length
                  $served = $true; break
                }
              } catch { }
            }
            if (-not $served) { throw "the installed app never served its UI on 127.0.0.1:8765" }
          } finally {
            Stop-Process -InputObject $srv -Force -ErrorAction SilentlyContinue
          }

          $u = Start-Process -FilePath "$dir\unins000.exe" -Wait -PassThru `
                             -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES"
          if ($u.ExitCode -ne 0) { throw "the uninstaller exited $($u.ExitCode)" }

      - name: Publish what the checks actually reported
        # Always, not just on failure. The Actions log needs a token to read,
        # and this project is maintained from a Mac that has none -- so the
        # evidence that these steps ran at all has to come out through
        # annotations, which the public API returns unauthenticated. Notices,
        # so they carry no failure weight.
        if: always()
        run: |
          foreach ($f in @(
              @{n='build tree'; p="$env:GITHUB_WORKSPACE\selftest-build.log"},
              @{n='portable zip'; p="$env:GITHUB_WORKSPACE\selftest-zip.log"},
              @{n='installed copy'; p="$env:GITHUB_WORKSPACE\selftest-installed.log"})) {
            if (Test-Path $f.p) {
              $body = ((Get-Content $f.p) -join "`n")
              $esc  = $body -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
              Write-Output "::notice title=selftest - $($f.n)::$esc"
            } else {
              Write-Output "::notice title=selftest - $($f.n)::NO REPORT WRITTEN -- the app did not run"
            }
          }

      - uses: actions/upload-artifact@v4
        if: steps.installer.outcome == 'success'
        with:
          name: Pakpatat-Setup-${{ env.VERSION }}
          path: dist/Pakpatat-Setup-*.exe
          if-no-files-found: error

      # Both files, and the glob for the .exe is allowed to match nothing --
      # action-gh-release does not fail on an unmatched pattern by default, so
      # a release still goes out with the portable .zip when ISCC could not
      # produce an installer.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*portable.zip
            dist/Pakpatat-Setup-*.exe
          body: |
            **Windows, 64-bit.** Two ways to get it:

            - **`Pakpatat-Setup-<version>.exe`** — the installer. Installs
              per-user, so it needs no administrator password. (Not present if
              the installer step failed for this build; use the .zip.)
            - **`Pakpatat-<version>-windows-x64-portable.zip`** — unzip it
              anywhere and run `Pakpatat.exe`. Nothing is installed and nothing
              is written outside the folder, so it runs from a USB stick or a
              managed laptop you are not an administrator on.

            Both contain the application only. They ship **no archive content** —
            see the README's notices. Point it at your own archive, or ask
            whoever maintains yours for the data folder.

            Offline answers additionally need [Ollama](https://ollama.com/download)
            and one `ollama pull qwen2.5:3b-instruct`.
