/* ============================ conversation store ========================= */
const $ = id => document.getElementById(id);
const wrap = $('wrap'), scroller = $('scroller'), qBox = $('q'), sendBtn = $('send');
const form = $('form'), filterSel = $('filter'), titleEl = $('title');

let CHATS = [];
try { CHATS = JSON.parse(localStorage.getItem('rm.chats') || '[]'); } catch { CHATS = []; }
let activeId = CHATS.length ? CHATS[0].id : null;
let nextId = Math.max(0, ...CHATS.map(c => c.id)) + 1;

const chat = () => CHATS.find(c => c.id === activeId);
const persist = () => localStorage.setItem('rm.chats', JSON.stringify(CHATS.slice(0, 50)));

function newChat() {
  activeId = null; qBox.value = ''; qBox.style.height = 'auto';
  renderHistory(); render(); qBox.focus();
}
function ensureChat(firstQuestion) {
  if (chat()) return chat();
  const c = { id: nextId++, title: firstQuestion.slice(0, 60), messages: [] };
  CHATS.unshift(c); activeId = c.id; return c;
}

function renderHistory() {
  const h = $('hist'); h.innerHTML = '';
  if (!CHATS.length) {
    h.innerHTML = `<div class="hist-empty">${esc(t('noHistory'))}</div>`; return;
  }
  for (const c of CHATS) {
    const d = document.createElement('div');
    d.className = 'hitem' + (c.id === activeId ? ' on' : '');
    d.innerHTML = `<span>${esc(c.title)}</span>
                   <button class="x" type="button" title="${esc(t('del'))}">×</button>`;
    d.onclick = e => {
      if (e.target.classList.contains('x')) {
        CHATS = CHATS.filter(x => x.id !== c.id); persist();
        if (activeId === c.id) activeId = null;
        renderHistory(); render(); return;
      }
      activeId = c.id; renderHistory(); render();
    };
    h.appendChild(d);
  }
}

/* ================================ rendering ============================== */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Escape first, then decorate — the escaped text can never contain raw markup.
/* Render the markdown the model actually emits.
 *
 * This used to handle bold and bare URLs only, which meant every other
 * construct reached the reader as literal punctuation: "### Step 1" with the
 * hashes showing, bullet lists as a column of hyphens, and -- worst -- the
 * REMEDI price table rendered as a wall of pipe characters, which is the one
 * place a reader most needs to compare two numbers side by side.
 *
 * Everything is escaped FIRST and only then given structure, so nothing the
 * model writes can inject markup. Inline formatting is applied per text-run,
 * never across the tags this builds.
 */
function inlineMd(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    // [S1] is the citation contract, not a markdown link -- style it, keep it.
    .replace(/\[(S\d+)\]/g, '<span class="cref">[$1]</span>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
             '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,
             '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}

function fmt(src) {
  const lines = esc(src).split('\n');
  const out = [];
  let i = 0;

  const isTableRow = l => /^\s*\|.*\|\s*$/.test(l);
  const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());

  while (i < lines.length) {
    const line = lines[i];

    if (!line.trim()) { i++; continue; }

    // Table: a header row, a |---|---| separator, then body rows.
    if (isTableRow(line) && isTableRow(lines[i + 1] || '') &&
        /^[\s|:-]+$/.test(lines[i + 1])) {
      const head = cells(line);
      i += 2;
      const body = [];
      while (i < lines.length && isTableRow(lines[i])) body.push(cells(lines[i++]));
      out.push(
        '<div class="twrap"><table><thead><tr>' +
        head.map(c => `<th>${inlineMd(c)}</th>`).join('') +
        '</tr></thead><tbody>' +
        body.map(r => '<tr>' + r.map(c => `<td>${inlineMd(c)}</td>`).join('') + '</tr>').join('') +
        '</tbody></table></div>');
      continue;
    }

    const h = line.match(/^\s*(#{1,6})\s+(.*)$/);
    if (h) {
      // An answer's headings sit inside the page, so they start at h3 -- but
      // they must still LOOK like section headings. The model writes "###" far
      // more than anything else; mapping by depth put that at h5, which is
      // styled as a small muted caption, so every section heading in every
      // answer read as an afterthought. Collapse the shallow levels to h3.
      const lvl = h[1].length <= 3 ? 3 : 4;
      out.push(`<h${lvl}>${inlineMd(h[2])}</h${lvl}>`);
      i++; continue;
    }

    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      const ordered = /^\s*\d+[.)]\s+/.test(line);
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, ''));
        i++;
      }
      out.push(`<${ordered ? 'ol' : 'ul'}>` +
               items.map(x => `<li>${inlineMd(x)}</li>`).join('') +
               `</${ordered ? 'ol' : 'ul'}>`);
      continue;
    }

    if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

    const para = [];
    while (i < lines.length && lines[i].trim() &&
           !isTableRow(lines[i]) &&
           !/^\s*#{1,6}\s+/.test(lines[i]) &&
           !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    if (para.length) out.push(`<p>${inlineMd(para.join('<br>'))}</p>`);
  }
  return out.join('');
}
const down = () => { scroller.scrollTop = scroller.scrollHeight; };

/* Reply languages the CURRENT provider may be asked to WRITE -- straight from
   settings.PROVIDERS via /settings. Retrieval is unaffected and works in both
   languages; this is only about the language the answer is composed in.

   Defaults to English-only until /settings lands. Briefly showing one line too
   few is recoverable; offering a Burmese line that comes back in English
   teaches people the language toggle is broken. Both the hero and the guide
   re-render when SETTINGS arrives and after any Settings save. */
const answerLangs = () => (SETTINGS && SETTINGS.answer_languages) || ['en'];
const writesBurmese = () => answerLangs().includes('my');

function heroHTML() {
  // A card's question text IS the query (data-ask), exactly like a guide line.
  // So when the provider cannot write Burmese the question goes out in English
  // while the LABEL stays in the reader's language -- the card is still
  // findable by someone reading Burmese, it just asks in a language the
  // selected model can answer.
  const enCards = STR.en.cards;
  const cards = t('cards').map(([ico, label, q], i) => {
    const ask = writesBurmese() ? q : ((enCards[i] || [])[2] ?? q);
    return `<button class="card" type="button" data-ask="${esc(ask)}">
       <span class="ico">${ico}</span>
       <span><b>${esc(label)}</b><small>${esc(ask)}</small></span>
     </button>`;
  }).join('');
  return `<div class="hero">
            <h1>${esc(t('heroTitle'))}</h1>
            <p>${esc(t('heroSub'))}</p>
            <div class="cards">${cards}</div>
            <button class="browse" id="browseBtn" type="button">
              💡 ${esc(t('browse'))}
            </button>
          </div>`;
}

/* The four hero cards are the common cases; this is the full map of what the
   archive actually covers. Reachable from the sidebar too, because the hero
   disappears as soon as a conversation starts and "what else can I ask?" is a
   question people have midway through, not only at the beginning. */
function renderGuide() {
  // Both languages are shown together, not one or the other. A CBO worker
  // reading English is usually sitting beside someone who reads Burmese, and
  // the answer comes back in whichever language the question was asked in --
  // so each line is separately tappable rather than following the UI toggle.
  //
  // ...UNLESS the selected provider cannot write Burmese. A guide question is
  // not a label: ui sends the tapped text as the real query (data-guide-ask),
  // so a Burmese line on a local model would come back in English every time.
  // Offering it would be advertising a language the app cannot answer in, so
  // the questions go English-only and the lede says why. The CATEGORY HEADINGS
  // stay bilingual -- they are never sent anywhere, so they cost nothing and a
  // Burmese reader can still navigate to the right section.
  const bilingual = writesBurmese();
  const near = LANG === 'my' ? 'my' : 'en';
  const far  = near === 'my' ? 'en' : 'my';
  const A = STR[near].guide, B = STR[far].guide;

  const lede = $('guideBody').parentElement.querySelector('.lede.alt');
  if (lede) lede.textContent = t(bilingual ? 'guideBoth' : 'guideEnglishOnly');

  $('guideBody').innerHTML = A.map(([ico, label, qs], ci) => {
    const bCat = B[ci] || ['', '', []];
    const enQs = (STR.en.guide[ci] || ['', '', []])[2];
    const askQs = bilingual ? qs : enQs;
    const askLang = bilingual ? near : 'en';
    const rows = askQs.map((q, qi) => {
      const alt = bilingual ? bCat[2][qi] : null;
      return `<li>
        <button type="button" class="gq" lang="${askLang}"
                data-guide-ask="${esc(q)}">${esc(q)}</button>
        ${alt ? `<button type="button" class="gq alt" lang="${far}"
                data-guide-ask="${esc(alt)}">${esc(alt)}</button>` : ''}
      </li>`;
    }).join('');
    return `<section class="gcat">
      <h3><span class="gico">${ico}</span>${esc(label)}
        <span class="galt" lang="${far}">${esc(bCat[1])}</span></h3>
      <ul>${rows}</ul>
    </section>`;
  }).join('');
}

function openGuide() {
  renderGuide();
  guideModal.hidden = false;
  $('guideClose').focus();
}

const KIND_STR = { phone: 'kindPhone', email: 'kindEmail',
                   amount: 'kindAmount', date: 'kindDate' };

function unverifiedHTML(list) {
  if (!list || !list.length) return '';
  const items = list.map(u =>
    `<li>${esc(t(KIND_STR[u.kind] || 'kindAmount'))}: <code>${esc(u.value)}</code></li>`
  ).join('');
  return `<div class="alert"><b>⚠ ${esc(t('unsafeTitle'))}</b>
            ${esc(t('unsafeBody'))}<ul>${items}</ul></div>`;
}

function answerHTML(m) {
  let h = `<div class="who"><span class="dot"></span>${esc(t('bot'))}</div>
           ${unverifiedHTML(m.unverified)}
           <div class="answer">${fmt(m.answer)}</div>`;
  // Said in the READER'S language, not the server's. The one person who sees
  // this asked in Burmese, so an English-only explanation of why their answer
  // is in English would be the same failure twice. The server sends a flag
  // (graph.ask -> lang_downgraded); the wording lives in STR.
  if (m.lang_downgraded)
    h += `<div class="warn"><span>ℹ</span><span>${esc(t('langDowngraded'))}</span></div>`;
  for (const w of (m.warnings || [])) h += `<div class="warn"><span>⚠</span><span>${esc(w)}</span></div>`;
  if ((m.sources || []).length) {
    h += `<div class="srcbox">
            <button class="srchead" type="button" aria-expanded="true">
              <span class="caret">▾</span>${esc(t('sources'))} · ${m.sources.length}
            </button><div class="srclist">`;
    for (const s of m.sources) {
      const badge = s.is_current
        ? `<span class="badge new">${esc(t('badgeNew'))}</span>`
        : `<span class="badge old">${esc(t('badgeOld'))}</span>`;
      const sec = s.section ? ` <span class="sec">— ${esc(s.section)}</span>` : '';
      // A source that is a document, not a page, is shown by its citation. The
      // link stays available as a cross-check but must not be the headline:
      // for the REMEDI minute the linked page still carries the OLD answer, and
      // a reader who clicks it before reading the citation concludes the app is
      // wrong -- when it is the website that has not caught up.
      const origin = s.citation
        ? `<div class="cite">${esc(s.citation)}</div>
           <div class="cite"><a href="${esc(s.url)}" target="_blank" rel="noopener"
              >${esc(t('crosscheck'))}</a></div>`
        : '';
      const label = s.citation
        ? `<span>${esc(s.title)}${sec}</span>`
        : `<span><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>${sec}</span>`;
      h += `<div class="src"><span class="tag">${esc(s.tag)}</span>${badge}
              ${label}${origin}
            </div>`;
    }
    h += '</div></div>';
  }
  h += `<div class="acts">
          <button class="act" type="button" data-copy>⧉ ${esc(t('copy'))}</button>
          <button class="act" type="button" data-post>🖼 ${esc(t('savePost'))}</button>
        </div>`;
  return h;
}

function render() {
  const c = chat();
  titleEl.textContent = c ? c.title : t('untitled');
  wrap.innerHTML = '';
  if (!c || !c.messages.length) { wrap.innerHTML = heroHTML(); return; }
  for (const m of c.messages) {
    const d = document.createElement('div');
    if (m.role === 'user') {
      d.className = 'msg user';
      d.innerHTML = `<div class="bubble">${esc(m.text)}</div>`;
    } else {
      d.className = 'msg bot';
      d.innerHTML = answerHTML(m);
    }
    wrap.appendChild(d);
  }
  down();
}

wrap.addEventListener('click', e => {
  if (e.target.closest('#browseBtn')) { openGuide(); return; }

  const card = e.target.closest('[data-ask]');
  if (card) { qBox.value = card.dataset.ask; form.requestSubmit(); return; }

  const head = e.target.closest('.srchead');
  if (head) {
    const open = head.getAttribute('aria-expanded') === 'true';
    head.setAttribute('aria-expanded', String(!open));
    head.nextElementSibling.hidden = open;
    return;
  }
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    navigator.clipboard.writeText(shareText(msgFor(cp)))
      .then(() => toast(t('copied')));
    return;
  }

  const pb = e.target.closest('[data-post]');
  if (pb) {
    const m = msgFor(pb);
    if (!m) return;
    // The question is the user message immediately before this answer.
    const msgs = chat()?.messages || [];
    const i = msgs.indexOf(m);
    const q = (i > 0 && msgs[i - 1].role === 'user') ? msgs[i - 1].text : '';
    const dark = matchMedia('(prefers-color-scheme: dark)').matches ||
                 document.body.classList.contains('dark');

    // Shift-click opens the native folder dialog through app.py's js_api; a
    // plain click behaves like a browser download and goes to Downloads. The
    // common case should not cost a dialog, and a webview cannot do a real
    // browser download, so this is the closest honest equivalent.
    const chooseDir = (e.shiftKey && window.pywebview?.api?.choose_folder)
      ? window.pywebview.api.choose_folder() : Promise.resolve(null);

    Promise.resolve(chooseDir).then(dir => {
      toast(t('saving'));
      return fetch('/post', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: m, question: q, dir: dir || null,
                              theme: dark ? 'dark' : 'light', lang: LANG})
      });
    }).then(r => r.json().then(j => ({ok: r.ok, j})))
      .then(({ok, j}) => {
        if (!ok) return toast(j.error === 'too_long' ? t('tooLong') : j.error);
        // Name the folder it actually went to. The first version said "saved to
        // your Desktop" while writing into data/posts/ inside the app -- so the
        // file was neither where it claimed to be nor anywhere a person looks.
        const where = (j.folder || '').replace(/^\/Users\/[^/]+/, '~');
        const label = j.count > 1 ? `${t('savedThread')} (${j.count})`
                                  : t('savedTo');
        toast(`${label} — ${where}`, j.folder);
      })
      .catch(() => toast(t('tooLong')));
  }
});

/* The message object behind a clicked button. Answers are rendered in the same
   order as chat().messages, so the DOM position is the index. */
function msgFor(el) {
  const node = el.closest('.msg');
  const idx = [...wrap.children].indexOf(node);
  return (chat()?.messages || [])[idx] || null;
}

/* What leaves the app when someone copies or shares an answer.
 *
 * Copy used to take `.answer` textContent alone. That dropped every citation,
 * the source list, the retired-site warning and the unverified-fact block --
 * so a hedged, sourced answer arrived in WhatsApp as a bare assertion with the
 * safety layers stripped off. The citations ARE the product; anything that
 * carries the answer out of the window has to carry them too. */
function shareText(m) {
  if (!m) return '';
  const L = [m.answer.trim()];

  for (const u of (m.unverified || []))
    L.push(`\n[!] ${t('unsafeTitle')}: ${u.value}`);
  for (const w of (m.warnings || []))
    L.push(`\n[!] ${w}`);

  if ((m.sources || []).length) {
    L.push(`\n${t('sources')}:`);
    for (const s of m.sources)
      L.push(`  [${s.tag}] ${s.title}${s.section ? ' — ' + s.section : ''}\n` +
             `        ${s.citation || s.url}`);
  }
  L.push(`\n— ${t('brandName')} · ${new Date().toISOString().slice(0, 10)}` +
         `\n${t('shareFooter')}`);
  return L.join('\n');
}

let toastTimer;
function toast(msg, folder) {
  let el = $('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  // "Saved to Downloads" only helps someone who knows where Downloads is.
  // When a file was written, offer to open the folder -- it removes the step
  // where a person goes hunting and gives up.
  if (folder) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'toast-act';
    b.textContent = t('showFile');
    b.onclick = () => fetch('/reveal', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({folder})
    });
    el.appendChild(b);
  }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), folder ? 9000 : 2200);
}

/* ================================== ask ================================= */
form.addEventListener('submit', async e => {
  e.preventDefault();
  const question = qBox.value.trim();
  if (!question || sendBtn.disabled) return;

  const c = ensureChat(question);
  // Snapshot the prior turns BEFORE adding this one -- the backend rewrites a
  // follow-up ("how much does it cost?") into a standalone search query using
  // these, and including the question itself would be circular. Answers are
  // sent trimmed: the subject the rewrite needs is always near the start.
  const history = c.messages.slice(-4).map(m => ({
    role: m.role,
    text: (m.role === 'user' ? m.text : m.answer || '').slice(0, 600),
  })).filter(m => m.text);

  c.messages.push({ role: 'user', text: question });
  persist(); renderHistory(); render();

  qBox.value = ''; qBox.style.height = 'auto';
  sendBtn.disabled = true; qBox.disabled = true;

  const pending = document.createElement('div');
  pending.className = 'msg bot';
  pending.innerHTML = `<div class="who"><span class="dot"></span>${esc(t('bot'))}</div>
                       <div class="typing"><i></i><i></i><i></i></div>
                       <div class="progress"></div>`;
  wrap.appendChild(pending); down();
  const prog = pending.querySelector('.progress');

  // /ask streams NDJSON: progress lines while the model works, then one final
  // {done:true, ...}. A local model can take a minute, and a webview kills a
  // request that sends nothing for ~60s -- the progress lines keep it alive.
  let result = null;
  try {
    const res = await fetch('/ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, history,
                             source_filter: filterSel.value || null }),
    });
    const takeLine = line => {
      if (!line.trim()) return;
      let msg;
      try { msg = JSON.parse(line); } catch { return; }
      if (msg.done) { result = msg; return; }
      const label = t('st_' + msg.stage) || '';
      prog.textContent = msg.elapsed ? `${label} ${msg.elapsed}s` : label;
      down();
    };

    await readNDJSON(res, takeLine);
  } catch {
    result = null;
  }
  if (!result) result = { answer: t('offline'), warnings: [], sources: [] };

  c.messages.push({ role: 'bot', answer: result.answer,
                    warnings: result.warnings || [], sources: result.sources || [],
                    unverified: result.unverified || [],
                    lang_downgraded: !!result.lang_downgraded });
  persist();
  pending.innerHTML = answerHTML(c.messages[c.messages.length - 1]);
  down();
  sendBtn.disabled = false; qBox.disabled = false; qBox.focus();
  refreshStatus();
});

qBox.addEventListener('input', () => {
  qBox.style.height = 'auto';
  qBox.style.height = Math.min(qBox.scrollHeight, 190) + 'px';
});
qBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

$('newBtn').onclick = newChat;
$('menuBtn').onclick = () => document.body.classList.toggle('nav');
$('rail').addEventListener('click', e => {
  if (e.target.closest('.hitem, #newBtn')) document.body.classList.remove('nav');
});

/* ================================ settings =============================== */
const modal = $('modal'), provSel = $('provider'), modelInp = $('model');
const keyInp = $('apiKey'), keyRow = $('keyRow'), keyState = $('keyState');
const provHelp = $('provHelp'), saveMsg = $('saveMsg');
const banner = $('banner'), bannerText = $('bannerText'), modePill = $('modePill');
let SETTINGS = null;

/* The ONE place SETTINGS is replaced. The hero cards and the guide bake the
   answer language into their data-ask payloads, so a provider change has to
   rebuild them: otherwise switching to Gemini leaves the Burmese lines hidden
   until a reload, and switching back to the local model leaves live Burmese
   lines that now quietly answer in English. Rebuilt only when the capability
   actually flips, so an ordinary status poll does not churn the DOM. */
function setSettings(s) {
  const had = writesBurmese();
  SETTINGS = s;
  if (had !== writesBurmese()) {
    render();
    if (!guideModal.hidden) renderGuide();
  }
  return s;
}

function renderStatus(s) {
  banner.hidden = !!s.ready;
  if (!s.ready) bannerText.textContent = s.ready_message;
  const p = s.providers && s.providers[s.provider];
  const local = s.provider === 'ollama';
  modePill.className = 'pill ' + (local ? 'on' : 'off');
  modePill.textContent = local ? t('modeLocal') : t('modeCloud')(p ? p.label : s.provider);
}

function syncProviderFields() {
  const p = SETTINGS.providers[provSel.value];
  if (!p) { provHelp.textContent = ''; keyRow.hidden = true; return; }
  provHelp.textContent = p.help;
  if (!modelInp.dataset.touched) modelInp.value = p.default_model;
  keyRow.hidden = !p.needs_key;
  keyState.textContent = (provSel.value === SETTINGS.provider && SETTINGS.has_key)
    ? `A key is already saved (${SETTINGS.key_hint}). Leave blank to keep it.` : '';
}

async function loadSettings() {
  setSettings(await (await fetch('/settings')).json());
  provSel.innerHTML = '';
  for (const [id, p] of Object.entries(SETTINGS.providers || {})) {
    const o = document.createElement('option');
    o.value = id; o.textContent = p.label;
    provSel.appendChild(o);
  }
  provSel.value = SETTINGS.provider;
  if (provSel.selectedIndex < 0) provSel.selectedIndex = 0;   // saved provider no longer offered
  modelInp.value = SETTINGS.model;
  delete modelInp.dataset.touched;
  syncProviderFields();
  renderStatus(SETTINGS);
}
let pollTimer = null;
const refreshStatus = () =>
  fetch('/settings').then(r => r.json()).then(s => {
    setSettings(s); renderStatus(s);
    // While something is still warming up (e.g. the local engine booting),
    // keep checking so the banner clears itself without a reload.
    clearTimeout(pollTimer);
    if (!s.ready) pollTimer = setTimeout(refreshStatus, 3000);
  }).catch(() => {});

function openSettings() {
  loadSettings()
    .then(() => { saveMsg.textContent = ''; keyInp.value = ''; modal.hidden = false; provSel.focus(); })
    .catch(() => toast(t('offline')));
}
$('settingsBtn').onclick = openSettings;
$('bannerFix').onclick = openSettings;
$('cancelBtn').onclick = () => { modal.hidden = true; };
modal.addEventListener('click', e => { if (e.target === modal) modal.hidden = true; });

$('guideBtn').onclick = openGuide;
$('guideClose').onclick = () => { guideModal.hidden = true; };
guideModal.addEventListener('click', e => {
  if (e.target === guideModal) { guideModal.hidden = true; return; }
  const btn = e.target.closest('[data-guide-ask]');
  if (!btn) return;
  // Close first, so the answer streaming in behind isn't hidden by the sheet.
  guideModal.hidden = true;
  document.body.classList.remove('nav');
  qBox.value = btn.dataset.guideAsk;
  form.requestSubmit();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    modal.hidden = true; guideModal.hidden = true;
    document.body.classList.remove('nav');
  }
});
provSel.onchange = () => { delete modelInp.dataset.touched; syncProviderFields(); };
modelInp.oninput = () => { modelInp.dataset.touched = '1'; };

$('saveBtn').onclick = async () => {
  saveMsg.textContent = t('saving');
  try {
    const res = await fetch('/settings', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider: provSel.value, model: modelInp.value,
                             api_key: keyInp.value || null }),
    });
    const s = await res.json();
    if (s.error) { saveMsg.textContent = 'Error: ' + s.error; return; }
    setSettings(s); keyInp.value = ''; renderStatus(s);
    saveMsg.textContent = '';
    modal.hidden = true; toast(t('saved'));
  } catch {
    saveMsg.textContent = t('offline');
  }
};

/* ------------------------------------------------------------ streaming ---
   Both long jobs in this app -- answering a question and first-run setup --
   reply as NDJSON: one JSON object per line, sent as it happens, so the OS
   webview never sees a silent connection and gives up on it. Reading that is
   the same six lines either way, so it lives here once.                     */
async function readNDJSON(res, takeLine) {
  if (res.body && res.body.getReader) {
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();                    // last piece may be incomplete
      lines.forEach(takeLine);
    }
    takeLine(buf);                          // trailing line with no newline
  } else {
    // Older webviews expose no streaming body. The whole response still
    // arrives at the end, so the work completes -- just without progress.
    (await res.text()).split('\n').forEach(takeLine);
  }
}

/* --------------------------------------------------------------- splash ---
   Ask the machine what it actually has before pretending to be ready.

   The five checks are shown, not just summed, because "not ready" is useless
   to a case worker while "the search index is stale, run this one command" is
   actionable. A minimum dwell keeps the mark on screen long enough to read on
   a fast machine, where /preflight returns in single-digit milliseconds and
   the splash would otherwise flash and vanish.                              */
const SPLASH_MIN_MS = 1250;

function hideSplash(el) {
  el.hidden = true;
  setTimeout(() => { el.style.display = 'none'; }, 500);   // after the fade
}

/* The steps the app can run for itself. preflight names one of these in a
   check's `action`; every other gap is advice only a person can act on, and
   those rows deliberately get no button. */
const SETUP_LABEL = {
  rebuild_index: 'actBuildIndex', pull_model: 'actPullModel',
  get_ollama: 'actGetOllama', settings: 'actSettings',
  // The splash's failing "Archive" row can now offer the same crawl the
  // Knowledge base panel does, for an install with nothing on it yet.
  crawl_archive: 'archiveGetBtn',
};
const STAGE_LABEL = {
  starting: 'setupStarting', reading: 'setupReading', model: 'setupModel',
  embedding: 'setupEmbedding', writing: 'setupWriting',
  installing: 'setupInstalling', downloading: 'setupDownloading',
  working: 'setupWorking',
  // The Knowledge base panel's crawl/check/update actions (pakpatat/archive.py)
  // report through this same machinery, so they need the same map.
  connecting: 'setupConnecting', crawling: 'setupCrawling',
  cataloguing: 'setupCataloguing', checking: 'setupChecking',
  fetching: 'setupFetching', chunking: 'setupChunking',
  // The optional archive bundle (pakpatat/bundle.py), step 0 of a crawl.
  bundle: 'setupBundle', unpacking: 'setupUnpacking',
};

/* A configured bundle that could not be fetched is reported and stepped over,
   never fatal -- the live crawl still produces a working app. It gets its own
   stage so the reason is shown rather than scrolling past inside a progress
   line the next event overwrites. */
const SKIP_STAGE = 'bundle_skipped';

function stageText(ev, pct) {
  const label = STAGE_LABEL[ev.stage] ? t(STAGE_LABEL[ev.stage]) : '';
  let line = label;
  if (pct !== null) line += ` ${pct}%`;
  else if (ev.elapsed) line += ` ${ev.elapsed}s`;
  // The page title mid-crawl, or Ollama's own status line mid-pull -- both
  // were already sent (pakpatat/archive.py's `detail`, pakpatat/firstrun.py's
  // pull_model) and neither was ever shown; a bare percentage told a person
  // THAT something was happening but not WHAT, which is the one thing worth
  // knowing during a two-minute crawl.
  if (ev.detail) line += ` — ${ev.detail}`;
  return line;
}

/* Run one setup step, reporting into the row that asked for it.

   The percentage comes from the server or not at all -- a fake bar that
   advances on a timer is a lie, and this one runs long enough (minutes for a
   2GB model) that being lied to is the difference between waiting and
   force-quitting halfway through a download. */
async function runSetup(action, ui, refresh) {
  const fill = ui.bar.firstElementChild;
  ui.btn.disabled = true;
  ui.bar.hidden = false;
  ui.msg.className = 'chk-msg';
  ui.msg.textContent = t('setupStarting');
  ui.hint.textContent = t('setupKeepOpen');

  let done = null;
  // The server interleaves keep-alive heartbeats with real progress, because
  // the connection has to keep making noise through the silent stretches. On
  // screen those two must not compete: letting a heartbeat overwrite the line
  // made the text flip between "41%" and "Working 6s" every few seconds and
  // the bar flip between filled and indeterminate, which reads as a fault.
  // So a heartbeat only ever adds the elapsed time to whatever was last
  // genuinely reported, and never touches the bar.
  let label = '';
  try {
    const res = await fetch('/setup', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action }),
    });
    await readNDJSON(res, line => {
      if (!line.trim()) return;
      let ev;
      try { ev = JSON.parse(line); } catch { return; }
      if (ev.done === true) { done = ev; return; }

      if (ev.stage === SKIP_STAGE) {
        ui.hint.textContent = `${t('setupBundleSkipped')} ${ev.detail || ''}`;
        return;
      }
      if (ev.stage === 'working') {
        ui.msg.textContent = label
          ? `${label} · ${ev.elapsed}s`
          : `${t('setupWorking')} ${ev.elapsed}s`;
        return;
      }
      const pct = (ev.total && ev.count != null)
        ? Math.max(1, Math.round(ev.count / ev.total * 100)) : null;
      // Indeterminate whenever there is no real number to show: loading the
      // model and swapping the index in report no progress of their own.
      ui.bar.classList.toggle('wait', pct === null);
      if (pct !== null) fill.style.width = pct + '%';
      label = stageText(ev, pct);
      ui.msg.textContent = label;
    });
  } catch {
    done = null;                              // window or server went away
  }

  ui.hint.textContent = '';
  if (done && done.ok) {
    ui.bar.classList.remove('wait');
    fill.style.width = '100%';
    ui.msg.textContent = t('setupDone');
    // Ask the machine again rather than assuming: the point of this screen is
    // that it reports what is actually there, and that has to stay true of the
    // moment right after a fix as much as the moment before it.
    refresh();
    return;
  }
  ui.bar.hidden = true;
  ui.btn.disabled = false;
  ui.msg.className = 'chk-msg err';
  ui.msg.textContent = !done ? t('offline')
    : done.busy ? t('setupBusy')
    : `${t('setupFailed')} — ${done.error || ''}`;
}

function actionRow(check, refresh) {
  const wrap = document.createElement('div');
  wrap.className = 'act';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'chk-btn';
  btn.textContent = t(SETUP_LABEL[check.action] || 'actSettings');
  const bar = document.createElement('div');
  bar.className = 'chk-bar wait';
  bar.hidden = true;
  bar.appendChild(document.createElement('span'));
  const msg = document.createElement('div');
  msg.className = 'chk-msg';
  const hint = document.createElement('div');
  hint.className = 'chk-hint';
  wrap.append(btn, bar, msg, hint);

  const ui = { btn, bar, msg, hint };
  btn.onclick = () => {
    if (check.action === 'settings') {
      hideSplash(document.getElementById('splash'));
      openSettings();
      return;
    }
    if (check.action === 'get_ollama') {
      // Installing a second application needs an administrator and a restart,
      // so the honest offer is the download page, not a button that pretends
      // to do it. The URL lives on the server side; nothing here can choose it.
      btn.disabled = true;
      fetch('/open-ollama', { method: 'POST' })
        .catch(() => {})
        .finally(() => { btn.disabled = false; msg.textContent = t('actAfterOllama'); });
      return;
    }
    runSetup(check.action, ui, refresh);
  };
  return wrap;
}

function renderChecks(report, list, refresh) {
  list.innerHTML = '';
  report.checks.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'chk ' + (c.ok ? 'ok' : 'bad');
    row.style.animationDelay = (i * 55) + 'ms';
    row.append(Object.assign(document.createElement('i'), {textContent: c.ok ? '✓' : '✕'}));
    const span = document.createElement('span');
    span.textContent = `${c.label} — ${c.detail}`;
    if (!c.ok && c.fix) span.append(' ' + c.fix);
    if (!c.ok && c.command) {
      span.append(' ');
      span.append(Object.assign(document.createElement('code'), {textContent: c.command}));
    }
    if (!c.ok && c.action) span.append(actionRow(c, refresh));
    row.append(span);
    list.appendChild(row);
  });
}

function renderProvenance(report, note) {
  const p = report.provenance || {};
  const bits = [];
  if (p.captured) bits.push(`Archive captured ${p.captured}.`);
  if (p.pending_count) bits.push(`${p.pending_count} change(s) staged for review.`);
  if (p.credit) bits.push(p.credit);
  note.textContent = bits.join(' ');
  note.hidden = bits.length === 0;
}

async function splashBoot() {
  const el = document.getElementById('splash');
  const list = document.getElementById('splashChecks');
  const note = document.getElementById('splashNote');
  const go = document.getElementById('splashGo');
  const started = Date.now();

  list.innerHTML = `<div class="chk"><i>·</i><span>${t('checking')}</span></div>`;

  async function load() {
    try {
      const r = await fetch('/preflight');
      return r.ok ? await r.json() : null;
    } catch {
      // Server not up yet is not worth showing here; a real problem will
      // surface when a question is asked, with better context than a splash
      // can give.
      return null;
    }
  }

  // Redrawn after every completed setup step, so a row that has just been
  // fixed turns green in front of the person who fixed it -- and so the button
  // disappears along with the problem instead of inviting a second run.
  //
  // `offerStart` is false only on a clean boot, where the splash dismisses
  // itself a beat later and a button would flash up for a quarter of a second.
  // Once anyone has stood on this screen and fixed something, they get a way
  // in -- reading "Start" rather than "Continue anyway", because by then it is
  // no longer an "anyway".
  function show(report, offerStart) {
    renderChecks(report, list, refresh);
    renderProvenance(report, note);
    if (!offerStart) return;
    go.hidden = false;
    go.dataset.i18n = report.ready ? 'startNow' : 'continueAnyway';
    go.textContent = t(go.dataset.i18n);
    go.onclick = () => hideSplash(el);
  }

  async function refresh() {
    const report = await load();
    if (report) show(report, true);
  }

  const report = await load();
  if (report) show(report, !report.ready);

  // A failed check must not lock anyone out. Part of the archive may still be
  // searchable, and a person sitting in front of a case worker is not helped
  // by a screen announcing that the tool has decided today is not the day.
  if (report && !report.ready) return;

  setTimeout(() => hideSplash(el), Math.max(0, SPLASH_MIN_MS - (Date.now() - started)));
}

/* ---------------------------------------------------- knowledge base -----
   What the archive holds, and the two ways to grow it: a first crawl for an
   install with nothing (crawl_archive), and a check -> review -> apply cycle
   for one that already works -- the same human-in-the-loop review
   pipeline/refresh.py asks for from a terminal, moved onto a button.
   pakpatat/archive.py does the fetching, diffing and atomic swap; this only
   renders what GET /archive reports and runs actions through the same
   runSetup() the splash uses, so a crawl looks and behaves identically
   whether it started here or there. */
const archiveModal = $('archiveModal');
const archiveBody = $('archiveBody');

// Which badge style and label each corpus source gets in the "Sources" row.
// '' (partner materials) falls back to the plain, unstyled .badge.
const SOURCE_LABEL = {
  new_site_help_unhcr_org: ['archiveSourceNew', 'new'],
  old_site_refugeemalaysia_org: ['archiveSourceOld', 'old'],
  partner_materials: ['archiveSourcePartner', ''],
};
const CRITICAL_LABEL = { phone: 'kindPhone', money: 'kindAmount', email: 'kindEmail' };

function fmtWhen(s) {
  // "2026-08-18 22:58:28" -> "2026-08-18 22:58". Seconds are precision nobody
  // reading this panel needs, and a raw ISO string with a T in it reads as a
  // bug report rather than a date.
  return s ? String(s).slice(0, 16).replace('T', ' ') : null;
}

// A citation-free reading of a doc_path for the critical-facts list --
// "help_unhcr_2026/pages/refugee-medical-insurance-remedi/index.md" tells a
// developer which file changed; "refugee medical insurance remedi" tells a
// case worker which PAGE did, which is the reader this panel is for.
function niceDoc(path) {
  const parts = String(path).split('/');
  const last = parts[parts.length - 1];
  const base = last === 'index.md' ? parts[parts.length - 2] : last.replace(/\.md$/, '');
  return String(base || last).replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/[-_]/g, ' ');
}

function archStat(value, label) {
  const box = document.createElement('div');
  box.className = 'archv-stat';
  box.append(Object.assign(document.createElement('b'), {textContent: value ?? '—'}));
  box.append(Object.assign(document.createElement('span'), {textContent: label}));
  return box;
}

// One action, built exactly like the splash's actionRow (chk-btn + chk-bar +
// chk-msg + chk-hint) and driven by the same runSetup() -- reused rather than
// reimplemented so the two surfaces cannot drift into different behaviour for
// the same server action.
function archRun(action, label, cls) {
  const wrap = document.createElement('div');
  wrap.className = 'archv-run';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = cls || 'btn';
  btn.textContent = label;
  const bar = document.createElement('div');
  bar.className = 'chk-bar wait';
  bar.hidden = true;
  bar.appendChild(document.createElement('span'));
  const msg = document.createElement('div'); msg.className = 'chk-msg';
  const hint = document.createElement('div'); hint.className = 'chk-hint';
  wrap.append(btn, bar, msg, hint);
  btn.onclick = () => runSetup(action, {btn, bar, msg, hint}, openArchive);
  return wrap;
}

function renderArchive(s) {
  archiveBody.innerHTML = '';
  if (!s) {
    archiveBody.append(Object.assign(document.createElement('div'), {
      className: 'archv-empty', textContent: t('offline'),
    }));
    return;
  }

  // ---- empty state: nothing on this computer to search yet ----
  if (!s.has_archive) {
    const empty = document.createElement('div');
    empty.className = 'archv-empty';
    empty.append(Object.assign(document.createElement('span'),
                               {className: 'ico', textContent: '📭'}));
    empty.append(Object.assign(document.createElement('div'),
                               {textContent: t('archiveEmptyBody')}));
    archiveBody.append(empty);
    archiveBody.append(archRun('crawl_archive', t('archiveGetBtn')));
    archiveBody.append(Object.assign(document.createElement('p'),
                                     {className: 'note', textContent: t('archiveGetHint')}));
    return;
  }

  // ---- what it holds ----
  const stats = document.createElement('div');
  stats.className = 'archv-stats';
  stats.append(
    archStat(s.documents, t('archiveStatDocs')),
    archStat(s.chunks, t('archiveStatChunks')),
    archStat(s.media, t('archiveStatMedia')),
  );
  archiveBody.append(stats);

  const sources = document.createElement('div');
  sources.className = 'archv-sources';
  for (const [key, count] of Object.entries(s.by_source || {})) {
    const [labelKey, cls] = SOURCE_LABEL[key] || [null, ''];
    sources.append(Object.assign(document.createElement('span'), {
      className: 'badge' + (cls ? ' ' + cls : ''),
      textContent: `${labelKey ? t(labelKey) : key} · ${count}`,
    }));
  }
  archiveBody.append(sources);

  const meta = document.createElement('div');
  meta.className = 'archv-meta';
  meta.textContent = [
    s.captured && `${t('archiveStatCaptured')}: ${fmtWhen(s.captured)}`,
    s.last_checked && `${t('archiveStatChecked')}: ${fmtWhen(s.last_checked)}`,
    s.last_applied && `${t('archiveStatApplied')}: ${fmtWhen(s.last_applied)}`,
  ].filter(Boolean).join('   ·   ');
  archiveBody.append(meta);

  // ---- coverage: what it is actually ABOUT, not just how big it is ----
  const covSection = document.createElement('div');
  covSection.className = 'archv-section';
  covSection.append(Object.assign(document.createElement('h3'),
                                  {textContent: t('archiveCoverageTitle')}));
  const topics = Object.entries(s.by_topic || {});
  if (topics.length) {
    const chips = document.createElement('div');
    chips.className = 'archv-topics';
    for (const [name, count] of topics.slice(0, 24)) {
      const chip = document.createElement('span');
      chip.className = 'archv-chip';
      chip.append(name, Object.assign(document.createElement('b'), {textContent: count}));
      chips.append(chip);
    }
    covSection.append(chips);
  } else {
    covSection.append(Object.assign(document.createElement('p'),
                                    {className: 'note', textContent: t('archiveCoverageNone')}));
  }
  archiveBody.append(covSection);
  archiveBody.append(Object.assign(document.createElement('hr'), {className: 'archv-hr'}));

  // ---- sync state: staged (reviewed, awaiting Apply/Discard) beats pending
  // (detected, not yet fetched) beats up-to-date. Never both at once: stage()
  // clears the raw pending ids as soon as it turns them into a staged build. ----
  if (s.staged) {
    const report = s.staged_report;
    archiveBody.append(Object.assign(document.createElement('p'), {
      className: 'note',
      textContent: report ? t('archiveStagedBody')(report.fetched.length, report.chunks)
                          : t('archiveStagedNoReport'),
    }));
    if (report && report.fetched && report.fetched.length) {
      const ul = document.createElement('ul');
      ul.className = 'archv-list';
      for (const f of report.fetched)
        ul.append(Object.assign(document.createElement('li'), {textContent: f.title}));
      archiveBody.append(ul);
    }
    // The one thing this whole review step exists to catch: a hotline, a fee
    // or an email address about to change. Reused styling from .alert -- the
    // same red the unverified-fact banner uses on an answer, because this is
    // the same category of "read this before you trust it".
    if (report && report.critical && report.critical.length) {
      const alert = document.createElement('div');
      alert.className = 'alert';
      alert.append(Object.assign(document.createElement('b'), {textContent: t('archiveCriticalTitle')}));
      const ul = document.createElement('ul');
      for (const c of report.critical) {
        const li = document.createElement('li');
        li.append(`${t(CRITICAL_LABEL[c.kind] || 'kindAmount')} — ${niceDoc(c.doc)}: `);
        [...(c.added || []), ...(c.removed || [])].forEach((v, i) => {
          if (i) li.append(', ');
          li.append(Object.assign(document.createElement('code'), {textContent: v}));
        });
        ul.append(li);
      }
      alert.append(ul);
      archiveBody.append(alert);
    } else if (report) {
      archiveBody.append(Object.assign(document.createElement('p'),
                                       {className: 'note', textContent: t('archiveCriticalNone')}));
    }
    archiveBody.append(archRun('apply_update', t('archiveApplyBtn'), 'btn'));
    archiveBody.append(archRun('discard_update', t('archiveDiscardBtn'), 'btn ghost'));
  } else if (s.pending_ids && s.pending_ids.length) {
    archiveBody.append(Object.assign(document.createElement('p'), {
      className: 'note', textContent: t('archivePendingTitle')(s.pending_ids.length),
    }));
    if (s.pending_titles && s.pending_titles.length) {
      const ul = document.createElement('ul');
      ul.className = 'archv-list';
      for (const p of s.pending_titles)
        ul.append(Object.assign(document.createElement('li'), {textContent: p.title}));
      archiveBody.append(ul);
    }
    archiveBody.append(archRun('stage_update', t('archiveBuildBtn'), 'btn'));
  } else {
    archiveBody.append(Object.assign(document.createElement('p'), {
      className: 'note',
      textContent: s.last_checked ? t('archiveUpToDate') : t('archiveNeverChecked'),
    }));
    archiveBody.append(archRun('check_updates', t('archiveCheckBtn'), 'btn'));
  }
}

async function loadArchiveStatus() {
  try {
    const r = await fetch('/archive');
    return r.ok ? await r.json() : null;
  } catch { return null; }
}

// Cached so a language switch while the panel is open can redraw from the
// last real answer instead of either freezing in the old language or firing
// a second /archive request that could land mid-action.
let ARCHIVE_STATUS = null;

async function openArchive() {
  archiveModal.hidden = false;
  ARCHIVE_STATUS = await loadArchiveStatus();
  renderArchive(ARCHIVE_STATUS);
}

$('archiveBtn').onclick = openArchive;
$('archiveClose').onclick = () => { archiveModal.hidden = true; };

/* ================================= start ================================ */
applyLang();
splashBoot();
refreshStatus();
qBox.focus();
</script>
</body>
</html>
